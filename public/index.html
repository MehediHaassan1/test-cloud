<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>User CRUD UI</title>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
		<div class="w-full max-w-3xl bg-white shadow-xl rounded-2xl p-6">
			<h1 class="text-2xl font-bold mb-4">User Management</h1>

			<!-- Form -->
			<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
				<input
					id="name"
					type="text"
					placeholder="Name"
					class="border p-2 rounded-lg"
				/>
				<input
					id="email"
					type="email"
					placeholder="Email"
					class="border p-2 rounded-lg"
				/>
				<button
					onclick="createUser()"
					class="bg-blue-600 text-white rounded-lg p-2 hover:bg-blue-700"
				>
					Add User
				</button>
			</div>

			<!-- Table -->
			<div class="overflow-x-auto">
				<table class="w-full border">
					<thead class="bg-gray-200">
						<tr>
							<th class="p-2 border">ID</th>
							<th class="p-2 border">Name</th>
							<th class="p-2 border">Email</th>
							<th class="p-2 border">Action</th>
						</tr>
					</thead>
					<tbody id="userTable"></tbody>
				</table>
			</div>
		</div>

		<script>
			const API = "/api/users";

			async function fetchUsers() {
				const res = await fetch(API);
				const data = await res.json();

				const table = document.getElementById("userTable");
				table.innerHTML = "";

				data.forEach((user) => {
					table.innerHTML += `
      <tr class='text-center'>
        <td class='border p-2'>${user.id}</td>
        <td class='border p-2'>${user.name}</td>
        <td class='border p-2'>${user.email}</td>
        <td class='border p-2'>
          <button onclick="deleteUser(${user.id})" class='bg-red-500 text-white px-2 py-1 rounded'>Delete</button>
        </td>
      </tr>
    `;
				});
			}

			async function createUser() {
				const name = document.getElementById("name").value;
				const email = document.getElementById("email").value;

				await fetch(API, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ name, email }),
				});

				document.getElementById("name").value = "";
				document.getElementById("email").value = "";

				fetchUsers();
			}

			async function deleteUser(id) {
				await fetch(`${API}/${id}`, {
					method: "DELETE",
				});

				fetchUsers();
			}

			fetchUsers();
		</script>
	</body>
</html>
